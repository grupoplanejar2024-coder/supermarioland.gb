<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Land - Kubo Touch</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #121212; color: #fff; font-family: Arial, sans-serif; }
        header { text-align: center; padding: 15px; background: #1e1e1e; }
        .badge { background: #e74c3c; color: #fff; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        #game-card { max-width: 500px; margin: 20px auto; background: #1e1e1e; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .cover-container { width: 100%; height: 250px; background-image: url('gb_supermarioland.jpg'); background-size: cover; background-position: center; }
        .content { padding: 20px; }
        h1 { margin: 0 0 10px 0; font-size: 24px; color: #e74c3c; }
        .meta-info { display: flex; gap: 10px; margin-bottom: 15px; font-size: 13px; color: #aaa; }
        .description { font-size: 14px; line-height: 1.5; color: #ddd; margin-bottom: 15px; }
        .details { font-size: 13px; color: #bbb; margin-bottom: 20px; }
        .details ul { padding-left: 20px; margin: 0; }
        .btn-play { display: block; width: 100%; padding: 12px; background: #c0392b; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-play:hover { background: #a93226; }
        #game-container { display: none; width: 100%; height: 100vh; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <header>
        <span class="badge">KUBO TOUCH</span>
    </header>

    <div id="game-card">
        <div class="cover-container"></div>
        <div class="content">
            <h1>Super Mario Land</h1>
            
            <div class="meta-info">
                <span>🎮 1 Jogador</span>
                <span>📅 1989</span>
                <span>🕹️ Nintendo</span>
            </div>

            <p class="description">
                Junte-se a Mario em sua primeira aventura portátil pelo reino de Sarasaland para resgatar a Princesa Daisy do misterioso vilão Tatanga!
            </p>

            <div class="details">
                <ul>
                    <li><strong>🕹️ Gênero:</strong> Plataforma</li>
                </ul>
            </div>

            <button class="btn-play" onclick="startEmulator()">JOGAR AGORA</button>
        </div>
    </div>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        function startEmulator() {
            document.getElementById('game-card').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';

            window.EJS_player = '#game';
            window.EJS_core = 'gb';
            window.EJS_gameName = 'Super Mario Land';
            window.EJS_color = '#e74c3c';
            window.EJS_startOnLoaded = true;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            
            window.EJS_gameUrl = 'supermarioland.gb';

            var script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
