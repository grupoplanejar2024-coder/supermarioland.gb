<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Super Mario Land - Kubo Touch</title>
  <meta name="theme-color" content="#e74c3c">
  <meta name="description" content="Jogue Super Mario Land no Kubo Touch.">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./gb_supermarioland.jpg">
  <link rel="apple-touch-icon" href="./gb_supermarioland.jpg">

  <style>
    :root {
      color-scheme: dark;
      --red: #e74c3c;
      --bg: #121212;
      --panel: #1e1e1e;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body { min-height: 100dvh; }

    header {
      padding: 16px;
      text-align: center;
      background: var(--panel);
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--red);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    #game-card {
      max-width: 500px;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 4px 20px #0008;
    }

    .cover {
      width: 100%;
      height: 250px;
      background: #222 url("./gb_supermarioland.jpg") center / contain no-repeat;
    }

    .content { padding: 20px; }

    h1 {
      margin: 0 0 12px;
      color: var(--red);
      font-size: 25px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      color: #aaa;
      font-size: 13px;
    }

    .description {
      color: #ddd;
      font-size: 14px;
      line-height: 1.6;
    }

    button {
      min-height: 48px;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--red);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .primary { width: 100%; }

    #game-container {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000;
    }

    #game {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
    }

    #game-toolbar {
      position: absolute;
      top: env(safe-area-inset-top, 0);
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px;
      pointer-events: none;
    }

    #game-toolbar button {
      min-height: 40px;
      padding: 8px 12px;
      font-size: 13px;
      pointer-events: auto;
    }

    #status {
      margin-top: 12px;
      color: #bbb;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 520px) {
      #game-card { margin: 12px; }
      .cover { height: 220px; }
    }
  </style>
</head>

<body>
  <header>
    <span class="badge">KUBO TOUCH</span>
  </header>

  <main id="game-card">
    <div class="cover" role="img" aria-label="Super Mario Land"></div>

    <section class="content">
      <h1>Super Mario Land</h1>

      <div class="meta">
        <span>🎮 1 jogador</span>
        <span>📅 1989</span>
        <span>🕹️ Game Boy</span>
      </div>

      <p class="description">
        Acompanhe Mario em sua aventura por Sarasaland para resgatar a Princesa Daisy do vilão Tatanga.
      </p>

      <button id="play-button" class="primary">
        JOGAR AGORA
      </button>

      <p id="status" role="status">
        Preparado para jogar.
      </p>
    </section>
  </main>

  <section id="game-container" aria-label="Emulador">
    <div id="game"></div>

    <div id="game-toolbar">
      <button id="menu-button">← Menu</button>
      <button id="fullscreen-button">⛶ Tela cheia</button>
    </div>
  </section>

  <script>
    const playButton = document.getElementById("play-button");
    const statusText = document.getElementById("status");
    const gameCard = document.getElementById("game-card");
    const gameContainer = document.getElementById("game-container");

    let emulatorStarted = false;

    // Registo do Service Worker para cache offline completo.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(() => console.log("Kubo Touch: SW registado com sucesso"))
          .catch(error => console.error("Erro no SW:", error));
      });
    }

function startEmulator() {
      if (emulatorStarted) return;

      emulatorStarted = true;
      playButton.disabled = true;
      statusText.textContent = "A carregar o jogo...";

      gameCard.style.display = "none";
      gameContainer.style.display = "block";

      // Configuração estável via CDN oficial para evitar falhas de carregamento em telemóveis
      window.EJS_player = "#game";
      window.EJS_core = "gb";
      window.EJS_gameName = "Super Mario Land";
      window.EJS_color = "#e74c3c";
      window.EJS_startOnLoaded = true;
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_gameUrl = "./supermarioland.gb";

      window.EJS_onGameStart = () => {
        statusText.textContent = "Jogo iniciado!";
      };

      const script = document.createElement("script");
      script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      script.onerror = () => {
        statusText.textContent = "Erro ao carregar o emulador.";
        playButton.disabled = false;
        emulatorStarted = false;
        gameCard.style.display = "block";
        gameContainer.style.display = "none";
      };

      document.body.appendChild(script);
    }

    playButton.addEventListener("click", startEmulator);

    document.getElementById("menu-button").addEventListener("click", () => {
      location.reload();
    });

    document.getElementById("fullscreen-button").addEventListener("click", () => {
      if (!document.fullscreenElement) {
        gameContainer.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    });
  </script>
</body>
</html>
